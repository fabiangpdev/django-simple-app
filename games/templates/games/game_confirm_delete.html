{% extends 'games/base.html' %}

{% block title %}Eliminar {{ object.title }} - GameVault{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger shadow">
            <div class="card-header bg-danger text-white py-3">
                <h5 class="mb-0">
                    <i class="bi bi-exclamation-triangle-fill"></i> Confirmar eliminacion
                </h5>
            </div>
            <div class="card-body p-4">
                <p class="fs-5">
                    Estas seguro de que deseas eliminar
                    <strong>{{ object.title }}</strong> de tu coleccion?
                </p>
                <p class="text-muted">
                    <i class="bi bi-info-circle"></i>
                    Esta accion no se puede deshacer.
                </p>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2 mt-3">
                        <button type="submit" class="btn btn-danger fw-bold px-4">
                            <i class="bi bi-trash-fill"></i> Si, eliminar
                        </button>
                        <a href="{{ object.get_absolute_url }}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left"></i> Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
